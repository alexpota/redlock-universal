name: Cluster Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cluster:
    name: Cluster (${{ matrix.server.name }}, ${{ matrix.clients.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Standalone server for the client-option tests that run next to the cluster tests
    services:
      standalone:
        image: ${{ matrix.server.image }}
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "${{ matrix.server.kind }}-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    strategy:
      matrix:
        server:
          - name: redis
            kind: redis
            image: redis:7-alpine
          - name: redis-8
            kind: redis
            image: redis:8-alpine
          - name: valkey
            kind: valkey
            image: valkey/valkey:8-alpine
          - name: valkey-9
            kind: valkey
            image: valkey/valkey:9-alpine
        clients:
          - name: dev dependencies
            install: ''
          - name: ioredis 6, redis 5
            install: ioredis@6.0.0 redis@5.12.1
          - name: redis 6, GLIDE 2.5
            install: redis@6.3.0 @valkey/valkey-glide@2.5.3
      fail-fast: false

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Install client versions
      if: matrix.clients.install != ''
      run: npm install --no-save --ignore-scripts $CLIENTS
      env:
        CLIENTS: ${{ matrix.clients.install }}

    - name: Start cluster
      run: scripts/test-cluster.sh up "$SERVER" "$IMAGE" >> "$GITHUB_ENV"
      env:
        SERVER: ${{ matrix.server.kind }}
        IMAGE: ${{ matrix.server.image }}

    - name: Test - Cluster and client options
      run: >-
        npx vitest --run tests/integration/cluster
        tests/integration/adapters/RedisAdapters.script-cache.integration.test.ts
        tests/integration/adapters/RedisAdapters.key-prefix.integration.test.ts

    - name: Stop cluster
      if: always()
      run: scripts/test-cluster.sh down
